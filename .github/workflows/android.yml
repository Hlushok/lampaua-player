name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Test, lint and build universal APK
        run: ./gradlew clean :app:testLatestUniversalDebugUnitTest :app:lintLatestUniversalDebug :app:assembleLatestUniversalDebug --console=plain

      - name: Verify packaged resources and signature
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/latestUniversal/debug -name '*.apk' -type f -print -quit)"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f -print -quit)"
          test -n "$apk"
          test -n "$build_tools"
          test -n "$apkanalyzer"
          python3 scripts/verify_apk.py \
            --apk "$apk" \
            --aapt2 "$build_tools/aapt2" \
            --apksigner "$build_tools/apksigner" \
            --apkanalyzer "$apkanalyzer"

      - name: Upload verified test APK
        uses: actions/upload-artifact@v6
        with:
          name: ua-player-test-apk
          path: app/build/outputs/apk/latestUniversal/debug/*.apk
          if-no-files-found: error
