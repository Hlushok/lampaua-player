name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore release signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${GITHUB_WORKSPACE}/keystore.jks"

      - name: Build signed universal APKs
        run: |
          chmod +x gradlew
          ./gradlew clean :app:testLatestUniversalDebugUnitTest :app:lintLatestUniversalRelease :app:assembleLatestUniversalRelease :app:assembleLegacyUniversalRelease --console=plain \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=key \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Verify release APKs
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f -print -quit)"
          test -n "$build_tools"
          test -n "$apkanalyzer"
          mapfile -t apks < <(find app/build/outputs/apk -path '*/release/*.apk' -type f -print)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            python3 scripts/verify_apk.py \
              --apk "$apk" \
              --aapt2 "$build_tools/aapt2" \
              --apksigner "$build_tools/apksigner" \
              --apkanalyzer "$apkanalyzer"
          done

      - name: Prepare draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/latestUniversal/release/*.apk
            app/build/outputs/apk/legacyUniversal/release/*.apk
          prerelease: true
          draft: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
