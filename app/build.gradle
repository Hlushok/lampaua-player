plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brouken.player'
    compileSdk = 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        def abiFilter = project.findProperty("abiFilter")
        applicationId "com.lampaua.player"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 22
        versionName "2.0.2"
        if (abiFilter) {
            def abiCodeMap = ["x86": 1, "x86_64": 2, "armeabi-v7a": 3, "arm64-v8a": 4]
            versionCode = versionCode * 10 + abiCodeMap[abiFilter]
            ndk {
                abiFilters abiFilter
            }
        }
    }
    base {
        archivesName = "LampaUA.Player.v${defaultConfig.versionName}"
    }
    buildTypes {
        release {
            minifyEnabled false
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The two Intel ABIs are 23 of the 54 MB this APK used to weigh, and nothing that plays video
            // runs on them: every phone, tablet and TV box is ARM, and the x86 Chromebooks that exist
            // translate ARM anyway. Release only, so a debug build still installs on the x86_64 emulator
            // that local checks run on. A whitelist, so what stays is stated rather than inferred.
            // Not the same thing as -PabiFilter above: this is still one universal APK with the plain
            // versionCode, which is what keeps updates working for everyone already on one.
            if (!project.hasProperty('abiFilter')) {
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
        }
    }
    flavorDimensions "targetSdk", "distribution"
    productFlavors {
        latest {
            dimension "targetSdk"
        }
        legacy {
            dimension "targetSdk"
            versionCode = defaultConfig.versionCode + 1_000_000
            versionNameSuffix "-legacy"
            targetSdkVersion 29
        }

        universal {
            dimension "distribution"
        }
        amazon {
            dimension "distribution"
        }
        accrescent {
            dimension "distribution"
        }
    }
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("legacy") && (names.contains("amazon") || names.contains("accrescent"))) {
            setIgnore(true)
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release" && variant.flavorName == "latestUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}.apk"
            }
        }
        if (variant.buildType.name == "release" && variant.flavorName == "legacyUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}-legacy.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        disable 'MissingTranslation'
        // The mirror of the line above, and Weblate's to reconcile either way: a string deleted here
        // stays in the translations until they are synced, and lintVital — which runs inside
        // assembleRelease — treats every one of those leftovers as a fatal error. It failed the
        // release build on translations of strings this app stopped having months ago.
        disable 'ExtraTranslation'
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    def media3_version = '1.11.0'
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    // Media reads go through OkHttp rather than HttpURLConnection, for the connection pool (see
    // MEDIA_HTTP_CLIENT). Excludes media3-exoplayer like every other media3 module here, so it resolves
    // against the local prebuilt AAR.
    implementation("androidx.media3:media3-datasource-okhttp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation("androidx.media3:media3-exoplayer-dash:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-rtsp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    // Rewrites Dolby Vision profile 7 metadata to profile 8.1. The app's local
    // ExoPlayer AAR remains authoritative, so duplicate Media3/Core artifacts
    // are excluded from this narrowly scoped native helper.
    implementation("com.suyashbelekar:exoplayerhdrutils:0.3.0") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
        exclude group: "androidx.core", module: "core-ktx"
    }
    implementation "androidx.media3:media3-datasource-rtmp:$media3_version"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.sigpwned:chardet4j:78.1.0'
    implementation project(path: ':doubletapplayerview')
    implementation project(path: ':android-file-chooser')
    implementation fileTree(dir: "libs", include: ["lib-*.aar"])
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
